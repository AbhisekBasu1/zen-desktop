<html:div id="zen-threads-return-card" hidden="true"/>

<menupopup id="zen-threads-context-menu">
  <menuitem id="zen-threads-ctx-open" label="Open thread"/>
  <menuseparator/>
  <menuitem id="zen-threads-ctx-rename" label="Rename…"/>
  <menuitem id="zen-threads-ctx-group" label="Group in sidebar"/>
  <menuitem id="zen-threads-ctx-compare" label="Compare candidates"/>
  <menuseparator/>
  <menuitem id="zen-threads-ctx-merge" label="Merge with…"/>
  <menuitem id="zen-threads-ctx-unmerge" label="Unmerge"/>
  <menuitem id="zen-threads-ctx-export" label="Copy as Markdown"/>
  <menuseparator/>
  <menuitem id="zen-threads-ctx-done" label="Done — archive and close tabs"/>
  <menuitem id="zen-threads-ctx-forget" label="Forget this thread…"/>
</menupopup>

<menupopup id="zen-threads-node-menu">
  <menuitem id="zen-threads-node-detach" label="Move out of this thread"/>
  <menuitem id="zen-threads-node-reattach" label="Put back in its thread"/>
</menupopup>

<html:div id="zen-threads-compare-backdrop" hidden="true">
  <html:div id="zen-threads-compare"/>
</html:div>

<vbox id="zen-threads-panel" hidden="true">
  <hbox id="zen-threads-header" align="center">
    <label id="zen-threads-title" value="Threads — live trail"/>
    <spacer flex="1"/>
    <toolbarbutton id="zen-threads-close" label="✕" oncommand="gZenThreadsManager.togglePanel();"/>
  </hbox>
  <vbox id="zen-threads-content" flex="1"/>
</vbox>
